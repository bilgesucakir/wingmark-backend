services:
  - type: web
    name: wingmark-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /actuator/health
    autoDeploy: true
    disk:
      name: wingmark-uploads
      mountPath: /data
      sizeGB: 1
    envVars:
      # Render has no managed MongoDB - point this at an Atlas cluster (or any
      # other reachable instance). Set the real value in the Render dashboard;
      # it's intentionally left out of this file and git.
      - key: DB_CONNECTION_STRING
        sync: false
      # Generated once by Render on first deploy and kept stable across deploys.
      - key: JWT_SECRET
        generateValue: true
      # Optional - only needed for the bird-sound guide feature
      # (https://xeno-canto.org/account). Leave blank to skip it.
      - key: XENO_CANTO_API_KEY
        sync: false
      # Where new photos are stored: gridfs (the database, the default) or r2 (Cloudflare R2; older photos
      # stay readable from the database). Switch to r2 only after the R2_* variables below are filled in. Set in the
      # dashboard (not here) so a Blueprint sync never resets it; unset means gridfs.
      - key: UPLOAD_STORAGE
        sync: false
      # Cloudflare R2 bucket for photos (used only with UPLOAD_STORAGE=r2). Set the real values in the Render
      # dashboard; the two keys are secrets and must never be written in this file or committed.
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_REGION
        value: auto
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # Copies photos from the database to R2 (needs UPLOAD_STORAGE=r2). Off; dry run first; never deletes anything.
      - key: R2_MIGRATION_ENABLED
        sync: false
      - key: R2_MIGRATION_DRY_RUN
        sync: false
      # Required to actually deliver the registration-verification email - without
      # these, users can register but never receive the link, and login() rejects
      # unverified accounts (see EmailServiceImpl / README "Deploying"). Any SMTP
      # provider works (SendGrid/Mailgun/SES's SMTP relay, etc); set the real values
      # in the Render dashboard.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Must be an address your SMTP provider is authorized to send from (most
      # providers reject an unverified sender domain). Set it to no-reply@wingmarkapp.com
      # in the dashboard once that sender is verified in Brevo.
      - key: MAIL_FROM
        sync: false
      # This service's own public URL - baked into the verification email link.
      # Matches Render's predictable https://<name>.onrender.com pattern for this
      # service, but Render appends a random suffix if that name is already taken -
      # confirm the actual assigned URL after first deploy and update this if it differs.
      - key: APP_BASE_URL
        value: https://wingmark-backend.onrender.com
