spring:
  application:
    name: wingmark-backend
  data:
    mongodb:
      uri: ${DB_CONNECTION_STRING:mongodb://localhost:27017/wingmark}
      # Without this, @Indexed/@CompoundIndex on the entities (unique email/username/
      # scientificName/tokenHash etc.) are inert - Spring Data Mongo does not create
      # indexes from annotations unless this is on.
      auto-index-creation: true
      # Uploaded images live in GridFS in this same database (uploads.files / uploads.chunks).
      gridfs:
        bucket: uploads
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Only consulted when the test-scoped embedded-mongo dependency is on the classpath
# (see the note at the bottom of this file); ignored otherwise.
de:
  flapdoodle:
    mongodb:
      embedded:
        version: 8.0.4

server:
  # Render (and most PaaS platforms) assign the port to listen on via $PORT;
  # SERVER_PORT remains the override for local/other environments.
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    # INFO by default and in production. Set LOG_LEVEL=DEBUG locally to see dev-only
    # details - e.g. undelivered verification links and reset codes when SMTP isn't set up.
    # Never set DEBUG in production: those are account-takeover secrets.
    com.wingmark.backend: ${LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # spring-boot-starter-mail auto-registers a health check that live-tests the SMTP
    # connection on every /actuator/health call. That would make the whole app's health
    # (and therefore Render's deploy/restart decisions) depend on the mail provider being
    # reachable right now - wrong, since EmailServiceImpl already treats a failed send as
    # non-fatal (logged, not thrown). Health should reflect "can this app serve requests".
    mail:
      enabled: false

wingmark:
  jwt:
    secret: ${JWT_SECRET:change-this-development-only-secret-key-please-override-me-1234567890}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  xeno-canto:
    base-url: ${XENO_CANTO_BASE_URL:https://xeno-canto.org/api/3}
    api-key: ${XENO_CANTO_API_KEY:}
  inaturalist:
    base-url: ${INATURALIST_BASE_URL:https://api.inaturalist.org/v1}
  mail:
    from: ${MAIL_FROM:no-reply@wingmark.app}
    # Most emails sent per UTC day; more are skipped with a warning. 0 = no cap.
    daily-cap: ${MAIL_DAILY_CAP:200}
  # Deletes accounts with no activity for two years after a warning email. Off by default; when on it only
  # logs until INACTIVITY_DRY_RUN=false.
  inactivity:
    enabled: ${INACTIVITY_CLEANUP_ENABLED:false}
    dry-run: ${INACTIVITY_DRY_RUN:true}
    inactive-after-days: ${INACTIVITY_AFTER_DAYS:730}
    warn-days-before-delete: ${INACTIVITY_WARN_DAYS_BEFORE:7}
    max-warnings-per-run: ${INACTIVITY_MAX_WARNINGS_PER_RUN:50}
    max-deletions-per-run: ${INACTIVITY_MAX_DELETIONS_PER_RUN:20}
    cron: ${INACTIVITY_CRON:0 30 3 * * *}
  # Deletes signups whose email was never verified, after N days, without emailing the address. Off by default.
  unverified-cleanup:
    enabled: ${UNVERIFIED_CLEANUP_ENABLED:false}
    dry-run: ${UNVERIFIED_DRY_RUN:true}
    older-than-days: ${UNVERIFIED_OLDER_THAN_DAYS:7}
    max-per-run: ${UNVERIFIED_MAX_PER_RUN:100}
    cron: ${UNVERIFIED_CRON:0 15 4 * * *}
  # Anonymous usage statistics: a species, region or bucket is shown only with at least this many different users.
  stats:
    min-group-size: ${STATS_MIN_GROUP_SIZE:5}
  uploads:
    # Most photos one user may have stored at once (0 = no limit).
    max-photos-per-user: ${MAX_PHOTOS_PER_USER:200}
    # Where new photos are stored: gridfs (the database, default) or r2 (Cloudflare R2; older photos stay readable from the database).
    storage: ${UPLOAD_STORAGE:gridfs}
  # Cloudflare R2 bucket for photos, used only with UPLOAD_STORAGE=r2. The two keys are secrets: set them only in the
  # host's environment, never in a file in the repo.
  r2:
    endpoint: ${R2_ENDPOINT:}
    bucket: ${R2_BUCKET:}
    region: ${R2_REGION:auto}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  # Copies photos from the database to R2 (needs UPLOAD_STORAGE=r2). Off by default; when on it only reports until
  # R2_MIGRATION_DRY_RUN=false. Never deletes anything from the database.
  r2-migration:
    enabled: ${R2_MIGRATION_ENABLED:false}
    dry-run: ${R2_MIGRATION_DRY_RUN:true}
    max-per-run: ${R2_MIGRATION_MAX_PER_RUN:50}
    cron: ${R2_MIGRATION_CRON:0 20 * * * *}
  # Deletes stored photos nothing refers to any more, after a grace period. Off by default; when on it only logs
  # until UPLOAD_CLEANUP_DRY_RUN=false.
  upload-cleanup:
    enabled: ${UPLOAD_CLEANUP_ENABLED:false}
    dry-run: ${UPLOAD_CLEANUP_DRY_RUN:true}
    grace-days: ${UPLOAD_CLEANUP_GRACE_DAYS:7}
    max-per-run: ${UPLOAD_CLEANUP_MAX_PER_RUN:100}
    cron: ${UPLOAD_CLEANUP_CRON:0 45 4 * * *}
  badges:
    # Recompute every user's badge progress at startup (set BADGE_RECOMPUTE_ON_STARTUP=false to skip).
    recompute-on-startup: ${BADGE_RECOMPUTE_ON_STARTUP:true}
  # Shown in email footers once set. Legal facts only the operator can supply - left
  # empty rather than guessed; nothing is shown until LEGAL_NAME is configured.
  business:
    legal-name: ${BUSINESS_LEGAL_NAME:}
    address: ${BUSINESS_ADDRESS:}
    contact-email: ${BUSINESS_CONTACT_EMAIL:}
  # Current Terms of Service / Privacy Policy versions. Blank = not published yet, so
  # acceptance isn't enforced; set a version (e.g. 2026-10-01) to require it at signup
  # and to ask existing users to accept it on their next login.
  # Browser origins allowed to call the API cross-origin (comma-separated). Empty = none:
  # the iOS app doesn't need CORS and the admin panel is same-origin.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  legal:
    terms-version: ${TERMS_VERSION:}
    terms-url: ${TERMS_URL:}
    privacy-version: ${PRIVACY_VERSION:}
    privacy-url: ${PRIVACY_URL:}
    # Minimum age to sign up; the signup checkbox and the AGE consent follow it.
    minimum-age: ${MINIMUM_AGE:13}
  app:
    # This backend's own public URL, used to build the link in verification emails
    # (the GET /api/auth/verify-email?token=... endpoint lives here, not on a frontend).
    base-url: ${APP_BASE_URL:http://localhost:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Defaults to a local MongoDB at mongodb://localhost:27017/wingmark. Point it at
# MongoDB Atlas (or any other instance) by overriding DB_CONNECTION_STRING, e.g.:
#   DB_CONNECTION_STRING=mongodb+srv://<user>:<password>@<cluster-host>/wingmark?retryWrites=true&w=majority
#
# Tests never need a running Mongo instance - an embedded in-memory instance
# (de.flapdoodle.embed.mongo) is started automatically for the test classpath.
