spring:
  application:
    name: wingmark-backend
  datasource:
    url: ${DB_URL:jdbc:h2:mem:wingmark;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

wingmark:
  jwt:
    secret: ${JWT_SECRET:change-this-development-only-secret-key-please-override-me-1234567890}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
  xeno-canto:
    base-url: ${XENO_CANTO_BASE_URL:https://xeno-canto.org/api/3}
    api-key: ${XENO_CANTO_API_KEY:}
  inaturalist:
    base-url: ${INATURALIST_BASE_URL:https://api.inaturalist.org/v1}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Using an in-memory H2 database for now (zero setup, data resets on restart) since
# the real database choice isn't decided yet. To switch later, override DB_URL/
# DB_USERNAME/DB_PASSWORD/DB_DRIVER as env vars - the Flyway migrations are written
# to be compatible with both H2 and Postgres, so no migration rewrite is needed.
