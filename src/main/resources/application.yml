spring:
  application:
    name: wingmark-backend
  data:
    mongodb:
      uri: ${DB_CONNECTION_STRING:mongodb://localhost:27017/wingmark}
      # Without this, @Indexed/@CompoundIndex on the entities (unique email/username/
      # scientificName/tokenHash etc.) are inert - Spring Data Mongo does not create
      # indexes from annotations unless this is on.
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Only consulted when the test-scoped embedded-mongo dependency is on the classpath
# (see the note at the bottom of this file); ignored otherwise.
de:
  flapdoodle:
    mongodb:
      embedded:
        version: 8.0.4

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

wingmark:
  jwt:
    secret: ${JWT_SECRET:change-this-development-only-secret-key-please-override-me-1234567890}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
  xeno-canto:
    base-url: ${XENO_CANTO_BASE_URL:https://xeno-canto.org/api/3}
    api-key: ${XENO_CANTO_API_KEY:}
  inaturalist:
    base-url: ${INATURALIST_BASE_URL:https://api.inaturalist.org/v1}
  mail:
    from: ${MAIL_FROM:no-reply@wingmark.app}
  app:
    # This backend's own public URL, used to build the link in verification emails
    # (the GET /api/auth/verify-email?token=... endpoint lives here, not on a frontend).
    base-url: ${APP_BASE_URL:http://localhost:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Defaults to a local MongoDB at mongodb://localhost:27017/wingmark. Point it at
# MongoDB Atlas (or any other instance) by overriding DB_CONNECTION_STRING, e.g.:
#   DB_CONNECTION_STRING=mongodb+srv://<user>:<password>@<cluster-host>/wingmark?retryWrites=true&w=majority
#
# Tests never need a running Mongo instance - an embedded in-memory instance
# (de.flapdoodle.embed.mongo) is started automatically for the test classpath.
