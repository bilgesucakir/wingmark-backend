spring:
  application:
    name: wingmark-backend
  data:
    mongodb:
      uri: ${DB_CONNECTION_STRING:mongodb://localhost:27017/wingmark}
      # Without this, @Indexed/@CompoundIndex on the entities (unique email/username/
      # scientificName/tokenHash etc.) are inert - Spring Data Mongo does not create
      # indexes from annotations unless this is on.
      auto-index-creation: true
      # Uploaded images live in GridFS in this same database (uploads.files / uploads.chunks).
      gridfs:
        bucket: uploads
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Only consulted when the test-scoped embedded-mongo dependency is on the classpath
# (see the note at the bottom of this file); ignored otherwise.
de:
  flapdoodle:
    mongodb:
      embedded:
        version: 8.0.4

server:
  # Render (and most PaaS platforms) assign the port to listen on via $PORT;
  # SERVER_PORT remains the override for local/other environments.
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    # INFO by default and in production. Set LOG_LEVEL=DEBUG locally to see dev-only
    # details - e.g. undelivered verification links and reset codes when SMTP isn't set up.
    # Never set DEBUG in production: those are account-takeover secrets.
    com.wingmark.backend: ${LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # spring-boot-starter-mail auto-registers a health check that live-tests the SMTP
    # connection on every /actuator/health call. That would make the whole app's health
    # (and therefore Render's deploy/restart decisions) depend on the mail provider being
    # reachable right now - wrong, since EmailServiceImpl already treats a failed send as
    # non-fatal (logged, not thrown). Health should reflect "can this app serve requests".
    mail:
      enabled: false

wingmark:
  jwt:
    secret: ${JWT_SECRET:change-this-development-only-secret-key-please-override-me-1234567890}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  xeno-canto:
    base-url: ${XENO_CANTO_BASE_URL:https://xeno-canto.org/api/3}
    api-key: ${XENO_CANTO_API_KEY:}
  inaturalist:
    base-url: ${INATURALIST_BASE_URL:https://api.inaturalist.org/v1}
  mail:
    from: ${MAIL_FROM:no-reply@wingmark.app}
  badges:
    # Recompute every user's badge progress at startup (set BADGE_RECOMPUTE_ON_STARTUP=false to skip).
    recompute-on-startup: ${BADGE_RECOMPUTE_ON_STARTUP:true}
  # Shown in email footers once set. Legal facts only the operator can supply - left
  # empty rather than guessed; nothing is shown until LEGAL_NAME is configured.
  business:
    legal-name: ${BUSINESS_LEGAL_NAME:}
    address: ${BUSINESS_ADDRESS:}
    contact-email: ${BUSINESS_CONTACT_EMAIL:}
  # Current Terms of Service / Privacy Policy versions. Blank = not published yet, so
  # acceptance isn't enforced; set a version (e.g. 2026-10-01) to require it at signup
  # and to ask existing users to accept it on their next login.
  # Browser origins allowed to call the API cross-origin (comma-separated). Empty = none:
  # the iOS app doesn't need CORS and the admin panel is same-origin.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  legal:
    terms-version: ${TERMS_VERSION:}
    terms-url: ${TERMS_URL:}
    privacy-version: ${PRIVACY_VERSION:}
    privacy-url: ${PRIVACY_URL:}
  app:
    # This backend's own public URL, used to build the link in verification emails
    # (the GET /api/auth/verify-email?token=... endpoint lives here, not on a frontend).
    base-url: ${APP_BASE_URL:http://localhost:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Defaults to a local MongoDB at mongodb://localhost:27017/wingmark. Point it at
# MongoDB Atlas (or any other instance) by overriding DB_CONNECTION_STRING, e.g.:
#   DB_CONNECTION_STRING=mongodb+srv://<user>:<password>@<cluster-host>/wingmark?retryWrites=true&w=majority
#
# Tests never need a running Mongo instance - an embedded in-memory instance
# (de.flapdoodle.embed.mongo) is started automatically for the test classpath.
