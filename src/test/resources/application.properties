# Test-only overrides (loaded on top of src/main/resources/application.yml).
# The suite registers hundreds of users from one address - rate limits are exercised by
# their own tests (which re-enable them), not by every test.
wingmark.rate-limit.enabled=false
# Never call the real Have I Been Pwned API from tests; PwnedPasswordCheckerTest stubs it.
wingmark.pwned-passwords.enabled=false
